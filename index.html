<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RiskMeter — Measure Risk. Stay Rational.</title>
  <style>
    :root{--bg:#0b1020;--fg:rgba(255,255,255,.88);--mut:rgba(255,255,255,.62);--line:rgba(255,255,255,.12)}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:var(--fg);
      background:radial-gradient(900px 500px at 20% 10%, rgba(118,228,255,.18), transparent 55%),
                 radial-gradient(900px 500px at 80% 20%, rgba(181,255,125,.14), transparent 55%),
                 var(--bg);}
    .wrap{max-width:980px;margin:0 auto;padding:46px 18px}
    .card{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:18px;padding:22px}
    h1{margin:0 0 10px;font-size:32px;letter-spacing:.2px}
    p{margin:0 0 18px;color:var(--mut);line-height:1.7}
    a.btn{display:inline-block;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
      background:rgba(255,255,255,.07);color:var(--fg);text-decoration:none}
    a.btn:hover{background:rgba(255,255,255,.12)}
    .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
    .small{margin-top:18px;font-size:12px;color:var(--mut)}
    .links a{color:rgba(118,228,255,.95)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>RiskMeter</h1>
      <p>Measure Risk. Stay Rational.<br/>用工具理解风险、控制回撤、减少情绪化决策。</p>
      <div class="row">
        <a class="btn" href="/pendulum/">进入 Market Pendulum →</a>
        <a class="btn" href="/about/">关于 / 免责声明</a>
      </div>
      <div class="small">
        RiskMeter 为教育用途，不构成投资建议或对任何标的的推荐。
      </div>
    </div>
  </div>
</body>
</html>
