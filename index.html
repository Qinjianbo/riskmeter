<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RiskMeter</title>
  <meta name="description" content="RiskMeter — Measure Risk. Stay Rational." />
  <meta name="robots" content="noindex" />
  <style>
    :root{--bg:#0b1020;--fg:rgba(255,255,255,.9);--mut:rgba(255,255,255,.62);--line:rgba(255,255,255,.12);--accent:#76e4ff}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;color:var(--fg);
      background:radial-gradient(900px 500px at 20% 10%, rgba(118,228,255,.18), transparent 55%),
                 radial-gradient(900px 500px at 80% 20%, rgba(181,255,125,.14), transparent 55%),
                 var(--bg);}
    .wrap{max-width:900px;margin:0 auto;padding:52px 18px}
    .card{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:20px;padding:26px}
    h1{margin:0 0 10px;font-size:30px}
    p{margin:0 0 18px;color:var(--mut);line-height:1.7}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    a.btn{display:inline-block;padding:12px 16px;border-radius:14px;border:1px solid var(--line);
      background:rgba(255,255,255,.08);color:var(--fg);text-decoration:none}
    a.btn:hover{background:rgba(255,255,255,.12)}
    a.btn.primary{border-color:rgba(118,228,255,.45);background:rgba(118,228,255,.16)}
    .small{margin-top:14px;font-size:12px;color:var(--mut)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>RiskMeter</h1>
      <p>Choose your language / 选择语言</p>
      <div class="row">
        <a class="btn primary" href="/en/">English</a>
        <a class="btn" href="/zh/">中文</a>
      </div>
      <div class="small">
        Tip: We auto-detect your language, but you can always switch.
      </div>
    </div>
  </div>

  <script>
    (function(){
      // If user already chose, respect it
      const saved = localStorage.getItem('rm_lang');
      if(saved === 'en') { location.replace('/en/'); return; }
      if(saved === 'zh') { location.replace('/zh/'); return; }

      // Auto-detect (soft)
      const lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      const preferZh = lang.startsWith('zh');

      // Delay a tiny bit so user sees the page if redirect blocked
      setTimeout(() => {
        location.replace(preferZh ? '/zh/' : '/en/');
      }, 250);
    })();
  </script>
</body>
</html>
