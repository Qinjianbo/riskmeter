<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>回撤承受空间计算器 · RiskMeter</title>
  <meta name="description" content="估算在不超过最大回撤的前提下，该仓位还能下跌多少。" />

  <link rel="alternate" hreflang="en" href="https://riskmeter.app/en/drawdown-capacity/" />
  <link rel="alternate" hreflang="zh" href="https://riskmeter.app/zh/drawdown-capacity/" />
  <link rel="alternate" hreflang="x-default" href="https://riskmeter.app/zh/drawdown-capacity/" />

  <style>
    :root{
      --bg:#0b1020;
      --panel:rgba(255,255,255,.06);
      --panel2:rgba(255,255,255,.10);
      --line:rgba(255,255,255,.12);
      --fg:rgba(255,255,255,.9);
      --mut:rgba(255,255,255,.62);
      --accent:#76e4ff;
      --accent2:#b5ff7d;
      --shadow:0 12px 40px rgba(0,0,0,.35);
      --radius:18px;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: var(--sans);
      color: var(--fg);
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(118,228,255,.18), transparent 55%),
        radial-gradient(900px 500px at 80% 20%, rgba(181,255,125,.14), transparent 55%),
        radial-gradient(700px 500px at 55% 95%, rgba(255,207,90,.10), transparent 60%),
        var(--bg);
      line-height:1.7;
    }
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}

    .wrap{max-width:980px;margin:0 auto;padding:42px 20px 80px}
    .hero{
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      border-radius:20px;
      padding:34px 32px;
      box-shadow: var(--shadow);
    }
    .pill{
      display:inline-block;
      padding:6px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      font-size:12px;
      color:var(--mut);
      margin-bottom:10px;
    }
    h1{margin:0 0 8px;font-size:34px;letter-spacing:.3px}
    .sub{color:var(--mut);max-width:860px;font-size:17px}
    .cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
    .btn{
      padding:12px 18px;
      border-radius:14px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.08);
      color:var(--fg);
      font-size:15px;
      display:inline-block;
    }
    .btn.primary{
      background:rgba(118,228,255,.16);
      border-color:rgba(118,228,255,.45);
    }
    .btn:hover{background:rgba(255,255,255,.12);text-decoration:none}

    .section{margin-top:30px}
    .toolCard{
      border:1px solid var(--line);
      background:var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .toolHead{
      padding:16px 18px;
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border-bottom:1px solid var(--line);
    }
    .toolHead h2{margin:0;font-size:18px}
    .toolHead .meta{margin:4px 0 0;color:var(--mut);font-size:13px;max-width:700px}
    .toolBody{padding:18px}

    .controls{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:14px;
    }
    @media (max-width: 720px){
      .controls{grid-template-columns:1fr}
      h1{font-size:30px}
    }

    .ctrl{
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      border-radius: 16px;
      padding:14px;
    }
    .ctrl label{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:12px;
      color: var(--mut);
    }
    .ctrl input[type="number"]{
      width:100%;
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.2);
      color:var(--fg);
      font-size:14px;
    }
    .hint{margin-top:8px; font-size:12px; color: var(--mut)}

    .summary{
      margin-top:16px;
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:12px;
    }
    @media (max-width: 820px){
      .summary{grid-template-columns:1fr}
    }

    .kv{
      padding:12px;
      border:1px solid var(--line);
      border-radius: 14px;
      background: rgba(0,0,0,.12);
    }
    .kv .k{color:var(--mut); font-size:12px}
    .kv .v{font-size:14px; margin-top:6px; color: var(--fg)}

    .note{
      margin-top:12px;
      border:1px dashed rgba(255,255,255,.18);
      border-radius:14px;
      color:var(--mut);
      font-size:12.5px;
      background: rgba(255,255,255,.03);
      padding:10px 12px;
    }
    .divider{height:1px;background:var(--line);margin:34px 0 18px}
    footer{margin-top:36px;font-size:12px;color:var(--mut)}
    .langBar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
    .langBar .tag{font-size:12px;color:var(--mut)}
  </style>
</head>

<body>
  <div class="wrap">
    <section class="hero">
      <span class="pill">风险仓位 · 回撤控制</span>
      <h1>回撤承受空间计算器</h1>
      <p class="sub">
        估算在不超过最大回撤的前提下，该仓位还可能下跌多少。
        这是仓位与风险的数学关系，不是预测。
      </p>

      <div class="langBar">
        <span class="tag">语言：</span>
        <span class="pill">中文</span>
        <a class="pill" href="/en/drawdown-capacity/" id="toEn">EN</a>
      </div>

      <div class="cta">
        <a class="btn primary" href="/zh/drawdown-test/">返回回撤承受度测试 →</a>
        <a class="btn" href="/zh/drawdown-explained/">阅读：回撤风险</a>
      </div>
    </section>

    <section class="section">
      <div class="toolCard">
        <div class="toolHead">
          <div>
            <h2>从现在开始还能跌多少？</h2>
            <p class="meta">计算假设其他资产不变。</p>
          </div>
        </div>
        <div class="toolBody">
          <div class="controls">
            <div class="ctrl">
              <label for="capTotal">总资产当前市值</label>
              <input type="number" id="capTotal" value="100000" min="0" step="1000" />
              <div class="hint">你当前账户的总市值。</div>
            </div>
            <div class="ctrl">
              <label for="capPosition">该仓位当前市值</label>
              <input type="number" id="capPosition" value="30000" min="0" step="1000" />
              <div class="hint">该标的当前市值。</div>
            </div>
            <div class="ctrl">
              <label for="capMaxDd">可接受的最大账户回撤（%）</label>
              <input type="number" id="capMaxDd" value="20" min="0" max="90" step="0.5" />
              <div class="hint">你的总体回撤上限（从峰值到谷值）。</div>
            </div>
            <div class="ctrl">
              <label for="capCurrentDd">当前账户回撤（%）</label>
              <input type="number" id="capCurrentDd" value="0" min="0" max="90" step="0.5" />
              <div class="hint">你当前距离峰值还差多少。</div>
            </div>
          </div>

          <div class="summary">
            <div class="kv">
              <div class="k">剩余可承受账户回撤</div>
              <div class="v" id="capRemaining">—</div>
            </div>
            <div class="kv">
              <div class="k">该仓位占比</div>
              <div class="v" id="capWeight">—</div>
            </div>
            <div class="kv">
              <div class="k">该仓位还能下跌</div>
              <div class="v" id="capPosDrop">—</div>
            </div>
          </div>

          <div class="note">
            该计算仅用于仓位与风险理解，不构成任何建议。
          </div>
        </div>
      </div>
    </section>

    <div class="divider"></div>
    <footer>
      RiskMeter 为教育用途，不提供投资建议，不推荐任何具体证券或标的。
    </footer>
  </div>

  <script>
    const capTotal = document.getElementById('capTotal');
    const capPosition = document.getElementById('capPosition');
    const capMaxDd = document.getElementById('capMaxDd');
    const capCurrentDd = document.getElementById('capCurrentDd');
    const capRemaining = document.getElementById('capRemaining');
    const capWeight = document.getElementById('capWeight');
    const capPosDrop = document.getElementById('capPosDrop');

    const formatCurrency = (value) => {
      const formatter = new Intl.NumberFormat('zh-CN', {
        style: 'currency',
        currency: 'CNY',
        maximumFractionDigits: 0
      });
      return formatter.format(value);
    };

    const formatPercent = (value) => `${value.toFixed(1)}%`;

    const updateCapacity = () => {
      const total = Number(capTotal.value) || 0;
      const position = Number(capPosition.value) || 0;
      const maxDd = Math.max(0, Number(capMaxDd.value) || 0);
      const currentDd = Math.max(0, Number(capCurrentDd.value) || 0);
      const remaining = Math.max(0, maxDd - currentDd);

      capRemaining.textContent = total > 0 ? `${formatPercent(remaining)} · ${formatCurrency(total * remaining / 100)}` : '—';

      if(total <= 0 || position <= 0){
        capWeight.textContent = '—';
        capPosDrop.textContent = '—';
        return;
      }

      const weight = position / total;
      capWeight.textContent = formatPercent(weight * 100);

      const posDrop = remaining / weight;
      if(!isFinite(posDrop)){
        capPosDrop.textContent = '—';
        return;
      }
      capPosDrop.textContent = posDrop >= 100 ? '≥100%' : formatPercent(posDrop);
    };

    [capTotal, capPosition, capMaxDd, capCurrentDd].forEach((el) => {
      el.addEventListener('input', updateCapacity);
    });
    updateCapacity();

    document.getElementById('toEn').addEventListener('click', () => localStorage.setItem('rm_lang','en'));
  </script>
</body>
</html>
